name: Build R66S firmware

on:
  workflow_dispatch:
    inputs:
      r66s_packages_ref:
        description: r66s-packages ref (branch, tag or full commit) supplying the prepare scripts and firmware content
        default: main
        required: true
        type: string
  push:
    branches: [r66s]
    paths:
      - '.github/workflows/r66s.yml'
      - 'config/r66s-lede.config'
      - 'files/**'
      - 'contrib/r66s/**'
      - 'target/linux/rockchip/**'
      - 'target/linux/generic/**'
      - 'package/kernel/r8125/**'
      - 'package/boot/uboot-rockchip/**'
      - 'package/boot/rkbin/**'
      - 'include/**'
      - 'toolchain/**'

permissions:
  contents: read

concurrency:
  group: r66s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-r66s-packages:
    runs-on: ubuntu-24.04
    outputs:
      # 每次构建只解析一次：两个下游 job 和缓存键都用这个提交。
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.R66S_PACKAGES_READ_KEY }}
      - name: Resolve the r66s-packages revision
        id: resolve
        env:
          PACKAGES_REF: ${{ inputs.r66s_packages_ref || 'main' }}
        run: |
          # 只解析出提交号：prepare 脚本、固件内容和缓存键随后都取自同一提交，
          # 构建中途 main 前移也不会让脚本和它装配的内容错位。要复现旧固件
          # 就把当次构建记录的提交号直接传给 r66s_packages_ref。
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$PWD/contrib/r66s/github-known-hosts"
          if [[ "$PACKAGES_REF" =~ ^[0-9a-f]{40}$ ]]; then
            sha=$PACKAGES_REF
          else
            sha=
            for ref in "$PACKAGES_REF" "refs/heads/$PACKAGES_REF" "refs/tags/$PACKAGES_REF"; do
              sha=$(git ls-remote git@github.com:GoAsyncFunc/r66s-packages.git "$ref" | awk 'NR==1 {print $1}')
              if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                break
              fi
            done
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Cannot resolve r66s-packages ref: $PACKAGES_REF" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "r66s-packages revision: $sha (ref $PACKAGES_REF)" >> "$GITHUB_STEP_SUMMARY"

  openclash-source-checks:
    needs: resolve-r66s-packages
    runs-on: ubuntu-24.04
    env:
      # prepare 脚本本身也来自该提交，与它装配的固件内容同源。
      R66S_PACKAGES_REVISION: ${{ needs.resolve-r66s-packages.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.R66S_PACKAGES_READ_KEY }}
      - name: Fetch R66S prepare scripts at the resolved revision
        run: |
          # prepare 脚本属于私有 r66s-packages，OpenWrt 源码不再保存其实现。
          set -euo pipefail
          checkout="$RUNNER_TEMP/r66s-prepare-source"
          mkdir -p "$checkout" contrib/r66s
          git -C "$checkout" init -q
          GIT_SSH_COMMAND="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$PWD/contrib/r66s/github-known-hosts" \
            git -C "$checkout" fetch --depth=1 "git@github.com:GoAsyncFunc/r66s-packages.git" "$R66S_PACKAGES_REVISION"
          git -C "$checkout" archive --format=tar FETCH_HEAD prepare/prepare-openclash.sh prepare/prepare-r66s-packages.sh |
            tar -x -C contrib/r66s --strip-components=1
      - name: Verify r66s-packages access and prefetch both archives
        run: |
          # 两个脚本都在这一步预取归档并打印实际使用的提交；正式构建复用同一提交。
          sh contrib/r66s/prepare-openclash.sh --source-only
          sh contrib/r66s/prepare-r66s-packages.sh --source-only

  storage-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test storage initialization on disposable loop devices
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends util-linux fdisk e2fsprogs
          sudo bash contrib/r66s/test-storage.sh
      - name: Test the Docker network initializer
        run: |
          # 纯 shell 桩测试，不需要 root、loop 设备或 Docker。
          sh contrib/r66s/test-docker-network.sh

  build:
    needs: [resolve-r66s-packages, storage-checks, openclash-source-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # 整次构建（prepare 脚本、固件内容、缓存键）使用同一个解析结果。
      R66S_PACKAGES_REVISION: ${{ needs.resolve-r66s-packages.outputs.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev python3 python3-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget curl ca-certificates bzip2 xz-utils zstd patch \
            diffutils perl time cpio bc device-tree-compiler
          mkdir -p logs
          df -h .

      - name: Authorize read-only OpenClash source access
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.R66S_PACKAGES_READ_KEY }}

      - name: Fetch R66S prepare scripts at the resolved revision
        run: |
          # 与 source-checks 使用同一 revision，确保校验和正式构建一致。
          set -euo pipefail
          checkout="$RUNNER_TEMP/r66s-prepare-source"
          mkdir -p "$checkout" contrib/r66s
          git -C "$checkout" init -q
          GIT_SSH_COMMAND="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$PWD/contrib/r66s/github-known-hosts" \
            git -C "$checkout" fetch --depth=1 "git@github.com:GoAsyncFunc/r66s-packages.git" "$R66S_PACKAGES_REVISION"
          git -C "$checkout" archive --format=tar FETCH_HEAD prepare/prepare-openclash.sh prepare/prepare-r66s-packages.sh |
            tar -x -C contrib/r66s --strip-components=1

      - name: Restore downloaded sources
        uses: actions/cache@v4
        with:
          path: |
            dl
            !dl/r66s-openclash
          key: r66s-dl-${{ runner.os }}-prepare-${{ needs.resolve-r66s-packages.outputs.sha }}-${{ hashFiles('target/linux/generic/kernel-6.18', 'package/kernel/r8125/Makefile', 'feeds.conf.default') }}
          restore-keys: |
            r66s-dl-${{ runner.os }}-prepare-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a 2>&1 | tee logs/feeds-update.log
          ./scripts/feeds install -a 2>&1 | tee logs/feeds-install.log

      - name: Configure R66S and check driver selection
        run: |
          sh contrib/r66s/prepare-defaults.sh
          sh contrib/r66s/prepare-openclash.sh | tee logs/openclash-sources.log
          sh contrib/r66s/prepare-r66s-packages.sh | tee logs/r66s-packages.log
          # 产物元数据：本次构建的 r66s-packages 提交（脚本与固件内容同源）。
          printf '%s\n' "$R66S_PACKAGES_REVISION" > logs/r66s-packages-revision.txt
          cp config/r66s-lede.config .config
          make defconfig 2>&1 | tee logs/defconfig.log
          grep -qx 'CONFIG_TARGET_rockchip_armv8_DEVICE_lunzn_fastrhino-r66s=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-r8125-rss=y' .config
          grep -qx 'CONFIG_PACKAGE_luci=y' .config
          grep -qx 'CONFIG_LUCI_LANG_zh_Hans=y' .config
          grep -qx 'CONFIG_TARGET_ROOTFS_PARTSIZE=1024' .config
          grep -qx 'CONFIG_KERNEL_SWAP=y' .config
          grep -qx 'CONFIG_IPV6=y' .config
          for package in zram-swap kmod-zram block-mount kmod-fs-ext4 e2fsprogs sfdisk partx-utils; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config
          done
          sh -n files/usr/sbin/r66s-data-setup
          sh -n files/usr/sbin/r66s-docker-network
          for package in base firewall package-manager; do
            grep -qx "CONFIG_PACKAGE_luci-i18n-${package}-zh-cn=y" .config
          done
          # MosDNS 先内置软件包，保持默认停用，后续单独验证 DNS 拓扑。
          for package in mosdns luci-app-mosdns luci-i18n-mosdns-zh-cn geo2txt v2ray-geoip v2ray-geosite; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config
          done
          mosdns_config=package/openwrt-packages/luci-app-mosdns/root/etc/config/mosdns
          grep -qx "[[:space:]]*option enabled '0'" "$mosdns_config"
          grep -qx "[[:space:]]*option redirect '0'" "$mosdns_config"
          grep -qx "[[:space:]]*option listen_address '127.0.0.1'" "$mosdns_config"
          for package in luci-app-openclash luci-compat dockerd docker luci-lib-docker luci-app-dockerman ttyd kmod-veth kmod-br-netfilter kmod-nft-bridge r66s-docker dnsmasq-full ip-full bash curl ca-bundle ruby ruby-yaml unzip kmod-tun kmod-inet-diag kmod-nft-tproxy firewall4; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config
          done
          grep -qx 'CONFIG_PACKAGE_dnsmasq_full_nftset=y' .config
          grep -qx 'CONFIG_PACKAGE_dnsmasq_full_dhcp=y' .config
          if grep -Eq '^CONFIG_PACKAGE_(dnsmasq|ip-tiny)=[ym]$' .config; then
            echo 'Unexpected minimal dnsmasq/ip package selected' >&2
            exit 1
          fi
          if grep -Eq '^CONFIG_PACKAGE_kmod-(r8169|r8125)=[ym]$' .config; then
            echo 'Unexpected competing Realtek driver selected' >&2
            exit 1
          fi
          ./scripts/diffconfig.sh > logs/config.seed
          git rev-parse HEAD > logs/source-commit.txt
          git diff --check
          sh -n target/linux/rockchip/armv8/base-files/etc/board.d/02_network
          sh -n target/linux/rockchip/armv8/base-files/etc/hotplug.d/net/40-net-smp-affinity

      - name: Download sources
        run: make download -j4 2>&1 | tee logs/download.log

      - name: Build firmware
        run: make -j2 V=s 2>&1 | tee logs/build.log

      - name: Verify R66S artifacts
        run: |
          shopt -s nullglob
          images=(bin/targets/rockchip/armv8/*-lunzn_fastrhino-r66s-squashfs-sysupgrade.img.gz)
          test "${#images[@]}" -eq 1
          image="${images[0]}"
          test -s "$image"
          # OpenWrt appends fwtool metadata (and optionally a signature)
          # after gzip. Validate a stripped copy, preserving the upgrade image.
          payload=$(mktemp "$RUNNER_TEMP/r66s-payload.XXXXXX")
          cp "$image" "$payload"
          staging_dir/host/bin/fwtool -s /dev/null -t "$payload" || :
          staging_dir/host/bin/fwtool -i logs/image-metadata.json -t "$payload"
          jq -e '.supported_devices | index("lunzn,fastrhino-r66s") != null and index("fastrhino,r66s") != null' logs/image-metadata.json
          gzip -t "$payload"
          manifest="${image%-squashfs-sysupgrade.img.gz}.manifest"
          grep -q '^kmod-r8125-rss ' "$manifest"
          for package in zram-swap kmod-zram block-mount kmod-fs-ext4 e2fsprogs sfdisk partx-utils; do
            grep -q "^${package} " "$manifest"
          done
          for package in base firewall package-manager; do
            grep -q "^luci-i18n-${package}-zh-cn " "$manifest"
          done
          for package in mosdns luci-app-mosdns luci-i18n-mosdns-zh-cn geo2txt v2ray-geoip v2ray-geosite; do
            grep -q "^${package} " "$manifest"
          done
          for package in luci-app-openclash luci-compat dockerd docker luci-lib-docker luci-app-dockerman ttyd kmod-veth kmod-br-netfilter kmod-nft-bridge r66s-docker dnsmasq-full ip-full bash curl ca-bundle ruby ruby-yaml unzip kmod-tun kmod-inet-diag kmod-nft-tproxy firewall4; do
            grep -q "^${package} " "$manifest"
          done
          if grep -Eq '^(dnsmasq|ip-tiny) ' "$manifest"; then
            echo 'Unexpected minimal dnsmasq/ip package in firmware' >&2
            exit 1
          fi
          roots=(build_dir/target-*/root-rockchip)
          test "${#roots[@]}" -eq 1
          test -x "${roots[0]}/usr/bin/mosdns"
          test -x "${roots[0]}/usr/bin/geo2txt"
          test -s "${roots[0]}/usr/share/v2ray/geoip.dat"
          test -s "${roots[0]}/usr/share/v2ray/geosite.dat"
          grep -qx "[[:space:]]*option enabled '0'" "${roots[0]}/etc/config/mosdns"
          grep -qx "[[:space:]]*option redirect '0'" "${roots[0]}/etc/config/mosdns"
          grep -qx "[[:space:]]*option listen_address '127.0.0.1'" "${roots[0]}/etc/config/mosdns"
          test -x "${roots[0]}/etc/openclash/core/clash_meta"
          test -s "${roots[0]}/etc/openclash/config/nomorewalls.yaml"
          test -x "${roots[0]}/etc/uci-defaults/98-r66s-openclash"
          grep -Fq "config_subscribe 'nomorewalls'" "${roots[0]}/etc/config/openclash"
          grep -Fq "option address 'https://raw.githubusercontent.com/GoAsyncFunc/r66s-packages/refs/heads/main/nomorewalls.yaml?token=" "${roots[0]}/etc/config/openclash"
          grep -Fq "option sub_ua 'clash-verge/v2.4.5'" "${roots[0]}/etc/config/openclash"
          grep -Fq "option auto_update '1'" "${roots[0]}/etc/config/openclash"
          grep -Fq "option config_path '/etc/openclash/config/nomorewalls.yaml'" "${roots[0]}/etc/config/openclash"
          cmp target/linux/rockchip/armv8/base-files/etc/board.d/02_network "${roots[0]}/etc/board.d/02_network"
          for setting in "ipv6_enable '1'" "ipv6_dns '1'" "ipv6_mode '0'" "enable_v6_udp_proxy '1'"; do
            grep -Fq "option $setting" "${roots[0]}/etc/config/openclash"
          done
          test -s "${roots[0]}/etc/openclash/Country.mmdb"
          test -s "${roots[0]}/etc/openclash/GeoSite.dat"
          test -s "${roots[0]}/etc/openclash/GeoIP.dat"
          # 覆写模块必须保持出厂关闭：误开启会生成核心无法解析的规则，
          # OpenClash 因此启动失败并把总开关复位成 0，开箱即用就不成立。
          test "$(grep -c "option enable '1'" "${roots[0]}/etc/config/openclash")" -eq 1
          test "$(grep -c "option enable '0'" "${roots[0]}/etc/config/openclash")" -eq 4
          test -s "${roots[0]}/usr/lib/lua/luci/i18n/openclash.zh-cn.lmo"
          file "${roots[0]}/etc/openclash/core/clash_meta" | grep -q 'ARM aarch64'
          grep -Fq 'lan) ipad=${ipaddr:-"192.168.77.1"}' "${roots[0]}/bin/config_generate"
          grep -Fq "set system.@system[-1].zram_size_mb='512'" "${roots[0]}/bin/config_generate"
          test -x "${roots[0]}/etc/init.d/zram"
          test -x "${roots[0]}/usr/sbin/r66s-data-setup"
          cmp contrib/r66s/r66s-data-setup "${roots[0]}/usr/sbin/r66s-data-setup"
          test -x "${roots[0]}/etc/uci-defaults/95-r66s-storage"
          test -x "${roots[0]}/usr/sbin/r66s-docker-network"
          cmp contrib/r66s/r66s-docker-network "${roots[0]}/usr/sbin/r66s-docker-network"
          # docker 区域由 dockerd 的 uciadd 建立，LAN 转发与容器 DNS 由 94 补齐。
          test -x "${roots[0]}/etc/uci-defaults/94-r66s-docker-network"
          grep -Fxq '/usr/sbin/r66s-docker-network' "${roots[0]}/etc/uci-defaults/94-r66s-docker-network"
          # 顺序即语义：94 必须早于 96 启动守护进程，否则 uciadd 拒绝改配置。
          test -x "${roots[0]}/etc/uci-defaults/96-r66s-docker"
          # Check the actual compressed image's MBR, not just .config.
          python3 - "$payload" <<'PY'
          import gzip, struct, sys
          with gzip.open(sys.argv[1], 'rb') as f:
              mbr = f.read(512)
          assert mbr[510:512] == b'\x55\xaa'
          parts = [struct.unpack_from('<B3sB3sII', mbr, 446 + i * 16) for i in range(4)]
          assert parts[0][4:] == (65536, 65536), parts
          assert parts[1][4:] == (196608, 2097152), parts
          assert parts[2][5] == parts[3][5] == 0, parts
          PY
          if grep -Eq '^kmod-(r8169|r8125) ' "$manifest"; then
            echo 'Unexpected competing Realtek driver in image manifest' >&2
            exit 1
          fi
          mapfile -t dtbs < <(find build_dir -name image-rk3568-r66s.dtb -type f)
          test "${#dtbs[@]}" -eq 1
          test "$(fdtget "${dtbs[0]}" / compatible)" = 'fastrhino,r66s rockchip,rk3568'
          echo 'Firmware build and artifact checks passed. Hardware boot and DHCP still need testing.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: r66s-firmware-${{ github.run_number }}
          path: |
            bin/targets/rockchip/armv8/*r66s*.img.gz
            bin/targets/rockchip/armv8/*r66s*.manifest
            bin/targets/rockchip/armv8/profiles.json
            bin/targets/rockchip/armv8/sha256sums
            bin/targets/rockchip/armv8/*.buildinfo
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs and resolved configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r66s-logs-${{ github.run_number }}
          include-hidden-files: true
          path: |
            logs/
            .config
          if-no-files-found: warn
          retention-days: 14
