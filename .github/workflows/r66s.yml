name: Build R66S firmware

on:
  workflow_dispatch:
  push:
    branches: [r66s]
    paths:
      - '.github/workflows/r66s.yml'
      - 'config/r66s-lede.config'
      - 'files/**'
      - 'contrib/r66s/**'
      - 'target/linux/rockchip/**'
      - 'target/linux/generic/**'
      - 'package/kernel/r8125/**'
      - 'package/boot/uboot-rockchip/**'
      - 'package/boot/rkbin/**'
      - 'include/**'
      - 'toolchain/**'

permissions:
  contents: read

concurrency:
  group: r66s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openclash-source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.R66S_PACKAGES_READ_KEY }}
      - name: Verify private OpenClash source access and archive checksum
        run: sh contrib/r66s/prepare-openclash.sh --source-only

  storage-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test storage initialization on disposable loop devices
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends util-linux fdisk e2fsprogs
          sudo bash contrib/r66s/test-storage.sh

  build:
    needs: [storage-checks, openclash-source-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev python3 python3-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget curl ca-certificates bzip2 xz-utils zstd patch \
            diffutils perl time cpio bc device-tree-compiler
          mkdir -p logs
          df -h .

      - name: Authorize read-only OpenClash source access
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.R66S_PACKAGES_READ_KEY }}

      - name: Restore downloaded sources
        uses: actions/cache@v4
        with:
          path: |
            dl
            !dl/r66s-openclash
          key: r66s-dl-${{ runner.os }}-${{ hashFiles('target/linux/generic/kernel-6.18', 'package/kernel/r8125/Makefile', 'feeds.conf.default', 'contrib/r66s/prepare-openclash.sh') }}
          restore-keys: |
            r66s-dl-${{ runner.os }}-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a 2>&1 | tee logs/feeds-update.log
          ./scripts/feeds install -a 2>&1 | tee logs/feeds-install.log

      - name: Configure R66S and check driver selection
        run: |
          sh contrib/r66s/prepare-defaults.sh
          sh contrib/r66s/prepare-openclash.sh | tee logs/openclash-sources.log
          sh contrib/r66s/prepare-r66s-packages.sh | tee logs/r66s-packages.log
          cp config/r66s-lede.config .config
          make defconfig 2>&1 | tee logs/defconfig.log
          grep -qx 'CONFIG_TARGET_rockchip_armv8_DEVICE_lunzn_fastrhino-r66s=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-r8125-rss=y' .config
          grep -qx 'CONFIG_PACKAGE_luci=y' .config
          grep -qx 'CONFIG_LUCI_LANG_zh_Hans=y' .config
          grep -qx 'CONFIG_TARGET_ROOTFS_PARTSIZE=1024' .config
          grep -qx 'CONFIG_KERNEL_SWAP=y' .config
          grep -qx 'CONFIG_IPV6=y' .config
          for package in zram-swap kmod-zram block-mount kmod-fs-ext4 e2fsprogs sfdisk partx-utils; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config
          done
          sh -n files/usr/sbin/r66s-data-setup
          for package in base firewall package-manager; do
            grep -qx "CONFIG_PACKAGE_luci-i18n-${package}-zh-cn=y" .config
          done
          for package in luci-app-openclash luci-compat dockerd docker luci-lib-docker luci-app-dockerman ttyd kmod-veth kmod-br-netfilter kmod-nft-bridge r66s-docker dnsmasq-full ip-full bash curl ca-bundle ruby ruby-yaml unzip kmod-tun kmod-inet-diag kmod-nft-tproxy firewall4; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config
          done
          grep -qx 'CONFIG_PACKAGE_dnsmasq_full_nftset=y' .config
          grep -qx 'CONFIG_PACKAGE_dnsmasq_full_dhcp=y' .config
          if grep -Eq '^CONFIG_PACKAGE_(dnsmasq|ip-tiny)=[ym]$' .config; then
            echo 'Unexpected minimal dnsmasq/ip package selected' >&2
            exit 1
          fi
          if grep -Eq '^CONFIG_PACKAGE_kmod-(r8169|r8125)=[ym]$' .config; then
            echo 'Unexpected competing Realtek driver selected' >&2
            exit 1
          fi
          ./scripts/diffconfig.sh > logs/config.seed
          git rev-parse HEAD > logs/source-commit.txt
          git diff --check
          sh -n target/linux/rockchip/armv8/base-files/etc/board.d/02_network
          sh -n target/linux/rockchip/armv8/base-files/etc/hotplug.d/net/40-net-smp-affinity

      - name: Download sources
        run: make download -j4 2>&1 | tee logs/download.log

      - name: Build firmware
        run: make -j2 V=s 2>&1 | tee logs/build.log

      - name: Verify R66S artifacts
        run: |
          shopt -s nullglob
          images=(bin/targets/rockchip/armv8/*-lunzn_fastrhino-r66s-squashfs-sysupgrade.img.gz)
          test "${#images[@]}" -eq 1
          image="${images[0]}"
          test -s "$image"
          # OpenWrt appends fwtool metadata (and optionally a signature)
          # after gzip. Validate a stripped copy, preserving the upgrade image.
          payload=$(mktemp "$RUNNER_TEMP/r66s-payload.XXXXXX")
          cp "$image" "$payload"
          staging_dir/host/bin/fwtool -s /dev/null -t "$payload" || :
          staging_dir/host/bin/fwtool -i logs/image-metadata.json -t "$payload"
          jq -e '.supported_devices | index("lunzn,fastrhino-r66s") != null and index("fastrhino,r66s") != null' logs/image-metadata.json
          gzip -t "$payload"
          manifest="${image%-squashfs-sysupgrade.img.gz}.manifest"
          grep -q '^kmod-r8125-rss ' "$manifest"
          for package in zram-swap kmod-zram block-mount kmod-fs-ext4 e2fsprogs sfdisk partx-utils; do
            grep -q "^${package} " "$manifest"
          done
          for package in base firewall package-manager; do
            grep -q "^luci-i18n-${package}-zh-cn " "$manifest"
          done
          for package in luci-app-openclash luci-compat dockerd docker luci-lib-docker luci-app-dockerman ttyd kmod-veth kmod-br-netfilter kmod-nft-bridge r66s-docker dnsmasq-full ip-full bash curl ca-bundle ruby ruby-yaml unzip kmod-tun kmod-inet-diag kmod-nft-tproxy firewall4; do
            grep -q "^${package} " "$manifest"
          done
          if grep -Eq '^(dnsmasq|ip-tiny) ' "$manifest"; then
            echo 'Unexpected minimal dnsmasq/ip package in firmware' >&2
            exit 1
          fi
          roots=(build_dir/target-*/root-rockchip)
          test "${#roots[@]}" -eq 1
          test -x "${roots[0]}/etc/openclash/core/clash_meta"
          cmp target/linux/rockchip/armv8/base-files/etc/board.d/02_network "${roots[0]}/etc/board.d/02_network"
          for setting in "ipv6_enable '1'" "ipv6_dns '1'" "ipv6_mode '0'" "enable_v6_udp_proxy '1'"; do
            grep -Fq "option $setting" "${roots[0]}/etc/config/openclash"
          done
          test -s "${roots[0]}/etc/openclash/Country.mmdb"
          test -s "${roots[0]}/etc/openclash/GeoSite.dat"
          test -s "${roots[0]}/usr/lib/lua/luci/i18n/openclash.zh-cn.lmo"
          file "${roots[0]}/etc/openclash/core/clash_meta" | grep -q 'ARM aarch64'
          grep -Fq 'lan) ipad=${ipaddr:-"192.168.77.1"}' "${roots[0]}/bin/config_generate"
          grep -Fq "set system.@system[-1].zram_size_mb='512'" "${roots[0]}/bin/config_generate"
          test -x "${roots[0]}/etc/init.d/zram"
          test -x "${roots[0]}/usr/sbin/r66s-data-setup"
          cmp contrib/r66s/r66s-data-setup "${roots[0]}/usr/sbin/r66s-data-setup"
          test -x "${roots[0]}/etc/uci-defaults/95-r66s-storage"
          # Check the actual compressed image's MBR, not just .config.
          python3 - "$payload" <<'PY'
          import gzip, struct, sys
          with gzip.open(sys.argv[1], 'rb') as f:
              mbr = f.read(512)
          assert mbr[510:512] == b'\x55\xaa'
          parts = [struct.unpack_from('<B3sB3sII', mbr, 446 + i * 16) for i in range(4)]
          assert parts[0][4:] == (65536, 65536), parts
          assert parts[1][4:] == (196608, 2097152), parts
          assert parts[2][5] == parts[3][5] == 0, parts
          PY
          if grep -Eq '^kmod-(r8169|r8125) ' "$manifest"; then
            echo 'Unexpected competing Realtek driver in image manifest' >&2
            exit 1
          fi
          mapfile -t dtbs < <(find build_dir -name image-rk3568-r66s.dtb -type f)
          test "${#dtbs[@]}" -eq 1
          test "$(fdtget "${dtbs[0]}" / compatible)" = 'fastrhino,r66s rockchip,rk3568'
          echo 'Firmware build and artifact checks passed. Hardware boot and DHCP still need testing.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: r66s-firmware-${{ github.run_number }}
          path: |
            bin/targets/rockchip/armv8/*r66s*.img.gz
            bin/targets/rockchip/armv8/*r66s*.manifest
            bin/targets/rockchip/armv8/profiles.json
            bin/targets/rockchip/armv8/sha256sums
            bin/targets/rockchip/armv8/*.buildinfo
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs and resolved configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r66s-logs-${{ github.run_number }}
          include-hidden-files: true
          path: |
            logs/
            .config
          if-no-files-found: warn
          retention-days: 14
